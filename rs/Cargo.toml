[package]
name = "cleat-rs"
version = "0.4.1"
edition = "2021"
publish = false

[lib]
name = "cleat_rs"
path = "src/lib.rs"

[[bin]]
name = "cleat-rs"
path = "src/main.rs"

[dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFRunLoop", "CFBundle", "CFURL"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSArray", "NSAttributedString", "NSDictionary", "NSData", "NSGeometry", "NSObjCRuntime", "NSURL", "NSPathUtilities", "NSBundle", "NSTimer", "NSDate", "NSRunLoop", "NSValue", "NSIndexSet", "NSNotification", "NSEnumerator", "NSRange", "NSThread", "block2", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std", "objc2-core-foundation", "objc2-uniform-type-identifiers", "block2", "libc",
  "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSViewController",
  "NSControl", "NSCell", "NSActionCell", "NSButton", "NSButtonCell", "NSSlider", "NSSliderCell",
  "NSTextField", "NSTextFieldCell", "NSText", "NSStackView", "NSScrollView", "NSClipView", "NSScroller",
  "NSImage", "NSImageView", "NSImageCell", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSTableCellView", "NSTableRowView",
  "NSSplitView", "NSSplitViewController", "NSSplitViewItem", "NSMenu", "NSMenuItem",
  "NSOpenPanel", "NSSavePanel", "NSPanel", "NSColor", "NSColorList", "NSColorSpace", "NSFont", "NSFontDescriptor", "NSBox",
  "NSLayoutConstraint", "NSLayoutAnchor", "NSUserInterfaceLayout", "NSGraphics", "NSGraphicsContext",
  "NSBezierPath", "NSEvent", "NSAppearance", "NSToolbar", "NSAttributedString", "NSStringDrawing",
  "NSTrackingArea", "NSUserInterfaceItemIdentification", "NSAccessibilityProtocols",
  "NSBitmapImageRep", "NSImageRep", "NSShadow", "NSWindowController", "NSAccessibilityConstants",
  "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSWorkspace", "NSTextAttachment", "NSParagraphStyle",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
libc = "0.2"
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release builds for distribution (scripts/build-release.sh): keep the symbol table so crash
# reports name functions, and line tables so dsymutil can produce a dSYM for atos.
[profile.dist]
inherits = "release"
strip = "none"
debug = "line-tables-only"
